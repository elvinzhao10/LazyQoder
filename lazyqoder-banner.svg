<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="LazyQoder banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f3a"/>
      <stop offset="55%" stop-color="#123a63"/>
      <stop offset="100%" stop-color="#1f6fb2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fd1c5"/>
      <stop offset="100%" stop-color="#63b3ed"/>
    </linearGradient>
  </defs>
  <rect width="960" height="240" fill="url(#bg)"/>
  <rect x="0" y="0" width="960" height="8" fill="url(#accent)"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#ffffff">
    <text x="64" y="120" font-size="84" font-weight="700" letter-spacing="1">Lazy<tspan fill="#63b3ed">Qoder</tspan></text>
    <text x="68" y="172" font-size="30" font-weight="400" fill="#cfe6ff" letter-spacing="2">Qoder CN workflow harness</text>
  </g>
  <rect x="64" y="196" width="240" height="6" rx="3" fill="url(#accent)"/>
</svg>
