name: Scheduled compatibility

on:
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Full compatibility (Node 26, macOS)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      LAZYQODER_VERIFY_SUITE: all
      LAZYQODER_VERIFY_TIMEOUT_SECONDS: 360
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26"
      - name: Install locked tooling dependencies
        working-directory: lazyqoder-plugin/tooling
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Run full package verification
        run: bash lazyqoder-plugin/scripts/lazyqoder-verify.sh
      - name: Run publication verification
        run: bash lazyqoder-plugin/tests/publication-regression.sh
